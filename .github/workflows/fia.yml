name: FIA watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fia_watcher.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Sauvegarder la liste des documents déjà vus
        run: |
          git config user.name "fia-bot"
          git config user.email "fia-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "maj seen.json" && git push)
